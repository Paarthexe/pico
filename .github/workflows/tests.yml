name: Test Pico
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests app.py sandbox/worker.py examples
      - run: ruff format --check src tests app.py sandbox/worker.py examples
      - run: pytest -q -m 'not docker'
        env:
          MPLBACKEND: Agg
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: docker build -f sandbox/Dockerfile -t pico-sandbox:1 .
      - run: pytest -q -m docker
        env:
          PICO_RUN_DOCKER_TESTS: '1'
          MPLBACKEND: Agg
