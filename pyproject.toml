[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-eda"
version = "0.1.0"
description = "Hypothesis-driven exploratory data analysis"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "streamlit>=1.50,<2", "pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["docker: requires an explicitly enabled, real Docker sandbox"]

[tool.setuptools.package-data]
"pico.ui" = ["*.css"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
